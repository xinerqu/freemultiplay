name: Test 32-bit DLL Load

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    
    - name: Build with MSBuild
      run: |
        msbuild test_dll.vcxproj -p:Configuration=Release -p:Platform=Win32 -m
    
    - name: Upload test DLL
      uses: actions/upload-artifact@v4
      with:
        name: test_steam_api_Win32
        path: build/Win32/steam_api.dll
